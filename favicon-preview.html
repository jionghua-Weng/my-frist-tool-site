<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favicon 方案预览</title>
<style>
  body { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; padding: 40px; }
  h1 { text-align: center; color: #39375b; margin-bottom: 40px; }
  .grid { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; max-width: 900px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 30px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; width: 200px; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
  .card.selected { border: 3px solid #3498db; box-shadow: 0 0 0 4px rgba(52,152,219,0.2); }
  .favicon-preview { width: 64px; height: 64px; margin: 0 auto 15px; }
  .favicon-small { width: 32px; height: 32px; margin: 0 auto 5px; }
  .label { font-size: 14px; color: #6b7280; margin-top: 8px; }
  .title { font-weight: 700; font-size: 16px; color: #111827; margin-bottom: 4px; }
  .size-label { font-size: 11px; color: #9ca3af; }
  .btn-row { text-align: center; margin-top: 40px; }
  button { background: #3498db; color: #fff; border: none; padding: 12px 32px; font-size: 16px; border-radius: 8px; cursor: pointer; }
  button:hover { background: #1464cc; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .section-label { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-top: 12px; }
</style>
</head>
<body>

<h1>英语研习社 — Favicon 方案预览</h1>
<p style="text-align:center;color:#6b7280;margin-top:-30px;margin-bottom:30px;">点击卡片选中，32px 和 64px 两种尺寸对比</p>

<div class="grid" id="grid">
  <!-- 方案1: 字母A - 深蓝底 -->
  <div class="card" data-id="1" onclick="select(this)">
    <div class="title">字母 A · 深蓝底</div>
    <div class="favicon-preview"><svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#39375b"/><text x="16" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff">A</text></svg></div>
    <div class="favicon-small"><svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#39375b"/><text x="16" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff">A</text></svg></div>
    <div class="size-label">64px / 32px</div>
  </div>

  <!-- 方案2: 字母A - 白底蓝字 -->
  <div class="card" data-id="2" onclick="select(this)">
    <div class="title">字母 A · 白底蓝字</div>
    <div class="favicon-preview"><svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#fff" stroke="#39375b" stroke-width="1.5"/><text x="16" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#3498db">A</text></svg></div>
    <div class="favicon-small"><svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#fff" stroke="#39375b" stroke-width="1.5"/><text x="16" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#3498db">A</text></svg></div>
    <div class="size-label">64px / 32px</div>
  </div>

  <!-- 方案3: 书本图标 -->
  <div class="card" data-id="3" onclick="select(this)">
    <div class="title">书本 · 深蓝底</div>
    <div class="favicon-preview"><svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#39375b"/><g transform="translate(6,5)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H2Z"/><path d="M18 3h-6a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h6Z"/></g></svg></div>
    <div class="favicon-small"><svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#39375b"/><g transform="translate(6,5)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H2Z"/><path d="M18 3h-6a3 3 0 0 0-3 3v14a3 3 0 0 1 3-3h6Z"/></g></svg></div>
    <div class="size-label">64px / 32px</div>
  </div>

  <!-- 方案4: 字母E -->
  <div class="card" data-id="4" onclick="select(this)">
    <div class="title">字母 E · 深蓝底</div>
    <div class="favicon-preview"><svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#39375b"/><text x="16" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff">E</text></svg></div>
    <div class="favicon-small"><svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#39375b"/><text x="16" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff">E</text></svg></div>
    <div class="size-label">64px / 32px</div>
  </div>

  <!-- 方案5: A+书本组合 -->
  <div class="card" data-id="5" onclick="select(this)">
    <div class="title">A + 书本 · 深蓝底</div>
    <div class="favicon-preview"><svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#39375b"/><text x="13" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#fff">A</text><text x="23" y="26" text-anchor="middle" font-size="14" fill="#3498db">📖</text></svg></div>
    <div class="favicon-small"><svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="6" fill="#39375b"/><text x="13" y="22" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#fff">A</text><text x="23" y="26" text-anchor="middle" font-size="14" fill="#3498db">📖</text></svg></div>
    <div class="size-label">64px / 32px</div>
  </div>

  <!-- 方案6: 渐变蓝 A -->
  <div class="card" data-id="6" onclick="select(this)">
    <div class="title">字母 A · 渐蓝底</div>
    <div class="favicon-preview"><svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3498db"/><stop offset="100%" stop-color="#39375b"/></linearGradient></defs><rect width="32" height="32" rx="6" fill="url(#g1)"/><text x="16" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff">A</text></svg></div>
    <div class="favicon-small"><svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g1s" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3498db"/><stop offset="100%" stop-color="#39375b"/></linearGradient></defs><rect width="32" height="32" rx="6" fill="url(#g1s)"/><text x="16" y="23" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#fff">A</text></svg></div>
    <div class="size-label">64px / 32px</div>
  </div>
</div>

<div class="btn-row">
  <p id="selected-label" style="margin-bottom:12px;color:#6b7280;">请点击选择一个方案</p>
  <button id="confirm-btn" disabled onclick="confirmChoice()">确认选择</button>
</div>

<script>
let selectedId = null;
function select(el) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedId = el.dataset.id;
  document.getElementById('selected-label').textContent = '已选择：方案' + selectedId;
  document.getElementById('confirm-btn').disabled = false;
}
function confirmChoice() {
  document.getElementById('selected-label').textContent = '已确认方案' + selectedId + '！请告诉 CC 你选的是方案 ' + selectedId;
  document.getElementById('confirm-btn').textContent = '已确认 ✓';
  document.getElementById('confirm-btn').disabled = true;
}
</script>

</body>
</html>
