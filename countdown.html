<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            text-align: center;
        }

        .datetime-picker {
            margin-bottom: 48px;
        }

        .datetime-picker input {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #eee;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 18px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .datetime-picker input:focus {
            border-color: rgba(255,255,255,0.4);
        }

        .datetime-picker button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            margin-left: 12px;
            transition: background 0.2s;
        }

        .datetime-picker button:hover {
            background: #d63851;
        }

        .timer {
            display: flex;
            gap: 32px;
            justify-content: center;
        }

        .block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number {
            font-size: 96px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            color: #e94560;
            min-width: 130px;
            text-align: center;
        }

        .label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.5);
            margin-top: 8px;
        }

        .divider {
            font-size: 80px;
            font-weight: 200;
            color: rgba(255,255,255,0.2);
            align-self: flex-start;
            margin-top: 4px;
        }

        .status {
            margin-top: 48px;
            font-size: 16px;
            color: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="datetime-picker">
            <input type="datetime-local" id="targetInput">
            <button onclick="setTarget()">开始倒计时</button>
        </div>

        <div class="timer">
            <div class="block">
                <div class="number" id="days">00</div>
                <div class="label">天</div>
            </div>
            <div class="divider">:</div>
            <div class="block">
                <div class="number" id="hours">00</div>
                <div class="label">时</div>
            </div>
            <div class="divider">:</div>
            <div class="block">
                <div class="number" id="minutes">00</div>
                <div class="label">分</div>
            </div>
            <div class="divider">:</div>
            <div class="block">
                <div class="number" id="seconds">00</div>
                <div class="label">秒</div>
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const statusEl = document.getElementById('status');
        const input = document.getElementById('targetInput');

        let target = null;

        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function tick() {
            if (!target) return;

            const now = new Date().getTime();
            const diff = target - now;

            if (diff <= 0) {
                daysEl.textContent = '00';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                statusEl.textContent = '时间到！';
                return;
            }

            const totalSec = Math.floor(diff / 1000);
            const d = Math.floor(totalSec / 86400);
            const h = Math.floor((totalSec % 86400) / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;

            daysEl.textContent = pad(d);
            hoursEl.textContent = pad(h);
            minutesEl.textContent = pad(m);
            secondsEl.textContent = pad(s);

            statusEl.textContent = '';
        }

        function setTarget() {
            const val = input.value;
            if (!val) return;
            target = new Date(val).getTime();
            tick();
        }

        // 默认：24小时后
        input.value = new Date(Date.now() + 24 * 3600 * 1000).toISOString().slice(0, 16);
        target = new Date(input.value).getTime();
        tick();

        setInterval(tick, 250);
    </script>
</body>
</html>
