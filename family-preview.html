<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金拱门一家人 — 预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e4e9f5;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.wrap{text-align:center}
h2{margin-bottom:40px;color:#39375b;font-size:28px}
.row{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-bottom:60px}
.face{position:relative;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.face:active{transform:scale(.94);transition:transform .15s}
.face .bg{display:block}
.face .eye-wrap{position:absolute;display:flex;align-items:center;justify-content:center;z-index:1;overflow:visible}
.face .pupil{background:#111;border-radius:44% 48% 42% 46%;z-index:1;position:relative}
.face .pupil::after{content:'';position:absolute;background:#fff;border-radius:50%;opacity:.85}
.face .mouth{position:absolute;left:50%;transform:translateX(-50%);z-index:1}
.face .mouth svg{display:block}

/* 爸爸 */
.face-dad{width:120px;height:120px}
.face-dad .eye-wrap{width:18px;height:20px}
.face-dad .eye-wrap.eye-l{top:32px;left:34px}
.face-dad .eye-wrap.eye-r{top:32px;right:34px}
.face-dad .pupil{width:8px;height:8px}
.face-dad .pupil::after{top:1.5px;left:1.5px;width:2.5px;height:2.5px}
.face-dad .mouth{bottom:24px}

/* 妈妈 */
.face-mom{width:96px;height:96px}
.face-mom .eye-wrap{width:15px;height:17px}
.face-mom .eye-wrap.eye-l{top:26px;left:26px}
.face-mom .eye-wrap.eye-r{top:26px;right:26px}
.face-mom .pupil{width:6.5px;height:6.5px}
.face-mom .pupil::after{top:1.2px;left:1.2px;width:2px;height:2px}
.face-mom .mouth{bottom:18px}

/* 宝宝 */
.face-kid{width:68px;height:68px}
.face-kid .eye-wrap{width:11px;height:13px}
.face-kid .eye-wrap.eye-l{top:18px;left:18px}
.face-kid .eye-wrap.eye-r{top:18px;right:18px}
.face-kid .pupil{width:5px;height:5px}
.face-kid .pupil::after{top:1px;left:1px;width:1.5px;height:1.5px}
.face-kid .mouth{bottom:13px}

.labels{display:flex;justify-content:center;gap:6px;margin-top:16px;color:#6b7280;font-size:14px}
.labels span{text-align:center}
.labels span:nth-child(1){width:120px}
.labels span:nth-child(2){width:96px}
.labels span:nth-child(3){width:68px}
</style>

<body>
<div class="wrap">
<h2>金拱门一家人 — 预览</h2>
<div class="row">

<!-- 爸爸 -->
<div class="face face-dad" id="faceDad">
    <svg class="bg" viewBox="0 0 100 100" width="120" height="120">
        <path d="M16 84 C18 58 22 34 26 22 C28 16 31 20 36 26 C39 32 42 35 48 35 C53 35 56 32 59 26 C64 20 67 16 69 22 C73 34 77 58 80 84 Z" fill="#f5c842" stroke="#d4a017" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M15 82 C17 56 21 32 25 20 C27 14 30 18 35 24 C38 30 41 33 48 33 C54 33 57 30 60 24 C65 18 68 14 70 20 C74 32 78 56 81 82 Z" fill="none" stroke="#c8950a" stroke-width="0.6" stroke-linejoin="round" opacity="0.4"/>
    </svg>
    <div class="eye-wrap eye-l">
        <svg viewBox="0 0 18 20" width="18" height="20">
            <ellipse cx="9" cy="10" rx="7.5" ry="8.5" fill="#fff" stroke="#d4a017" stroke-width="0.8" transform="rotate(-3 9 10)"/>
        </svg>

    </div>
    <div class="eye-wrap eye-r">

    </div>

        </svg>
    </div>
</div>

<!-- 妈妈 -->
<div class="face face-mom" id="faceMom">
    <svg class="bg" viewBox="0 0 100 100" width="96" height="96">
        <path d="M16 84 C18 58 22 34 26 22 C28 16 31 20 36 26 C39 32 42 35 48 35 C53 35 56 32 59 26 C64 20 67 16 69 22 C73 34 77 58 80 84 Z" fill="#f8c8d4" stroke="#d498a8" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M15 82 C17 56 21 32 25 20 C27 14 30 18 35 24 C38 30 41 33 48 33 C54 33 57 30 60 24 C65 18 68 14 70 20 C74 32 78 56 81 82 Z" fill="none" stroke="#c88090" stroke-width="0.6" stroke-linejoin="round" opacity="0.4"/>
    </svg>
    <div class="eye-wrap eye-l">
        <svg viewBox="0 0 18 20" width="15" height="17">
            <ellipse cx="9" cy="10" rx="7.5" ry="8.5" fill="#fff" stroke="#d498a8" stroke-width="0.8" transform="rotate(-3 9 10)"/>
            <path d="M2 3 Q4 1 6 2.5 M5 2 Q7 0 9 1.5 M8 1.5 Q10 0 12 1.5" fill="none" stroke="#d498a8" stroke-width="0.6" stroke-linecap="round"/>
        </svg>
        <div class="pupil" style="position:absolute"></div>
    </div>
    <div class="eye-wrap eye-r">
        <svg viewBox="0 0 18 20" width="15" height="17">
            <ellipse cx="9" cy="10" rx="6.5" ry="7.5" fill="#fff" stroke="#d498a8" stroke-width="0.8" transform="rotate(3 9 10)"/>
            <path d="M6 1.5 Q8 0 10 1.5 M9 2 Q11 0 13 2 M12 2.5 Q14 1 15.5 3" fill="none" stroke="#d498a8" stroke-width="0.6" stroke-linecap="round"/>
        </svg>
        <div class="pupil" style="position:absolute"></div>
    </div>
    <div class="mouth">
        <svg width="22" height="10" viewBox="0 0 22 10">

    </div>
</div>

<!-- 宝宝 -->
<div class="face face-kid" id="faceKid">
    <svg class="bg" viewBox="0 0 100 100" width="68" height="68">
        <path d="M20 82 C21 60 24 38 28 26 C30 20 33 24 37 28 C40 32 42 34 48 34 C54 34 56 32 59 28 C63 24 66 20 68 26 C71 38 74 60 76 82 Z" fill="#ffeaa7" stroke="#e8b730" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M19 80 C20 58 23 36 27 24 C29 18 32 22 36 26 C39 30 41 32 48 32 C55 32 57 30 60 26 C64 22 67 18 69 24 C72 36 75 58 77 80 Z" fill="none" stroke="#d4a017" stroke-width="0.6" stroke-linejoin="round" opacity="0.3"/>
        <ellipse cx="28" cy="50" rx="6" ry="3.5" fill="#ffb3ba" opacity="0.5"/>
        <ellipse cx="68" cy="50" rx="6" ry="3.5" fill="#ffb3ba" opacity="0.5"/>
    </svg>
    <div class="eye-wrap eye-l">
        <svg viewBox="0 0 18 20" width="11" height="13">
            <ellipse cx="9" cy="10" rx="7" ry="8" fill="#fff" stroke="#e8b730" stroke-width="0.8" transform="rotate(-2 9 10)"/>
        </svg>
        <div class="pupil" style="position:absolute"></div>
    </div>
    <div class="eye-wrap eye-r">
        <svg viewBox="0 0 18 20" width="11" height="13">
            <ellipse cx="9" cy="10" rx="6" ry="7" fill="#fff" stroke="#e8b730" stroke-width="0.8" transform="rotate(2 9 10)"/>
        </svg>
        <div class="pupil" style="position:absolute"></div>
    </div>
    <div class="mouth">
        <svg width="16" height="8" viewBox="0 0 16 8">
            <path d="M2 3 Q8 7 14 3" fill="none" stroke="#111" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
    </div>
</div>

</div>
<div class="labels">
    <span>爸爸 120px</span>
    <span>妈妈 96px</span>
    <span>宝宝 68px</span>
</div>
</div>

<script>
// === 所有脸的眼睛跟踪鼠标 ===
(function(){
var faces = document.querySelectorAll('.face');
var allPupils = [];
faces.forEach(function(face){
    var pupils = face.querySelectorAll('.pupil');
    // 确保瞳孔是可移位的
    pupils.forEach(function(p){
        p.style.position = 'absolute';
        p.style.left = '50%';
        p.style.top = '50%';
        p.style.transform = 'translate(-50%,-50%)';
    });
    allPupils.push({face:face, pupils:Array.from(pupils)});
});

// 各尺寸脸的瞳孔最大偏移
function getMaxShift(faceW){
    if(faceW >= 120) return 5;   // 爸爸
    if(faceW >= 96)  return 4.2; // 妈妈
    return 3;                     // 宝宝
}

document.addEventListener('mousemove', function(e){
    allPupils.forEach(function(item){
        var r = item.face.getBoundingClientRect();
        var cx = r.left + r.width/2;
        var cy = r.top + r.height/2;
        var dx = e.clientX - cx;
        var dy = e.clientY - cy;
        var dist = Math.sqrt(dx*dx + dy*dy);
        var maxDist = 200;
        var ratio = Math.min(dist/maxDist, 1);
        var maxShift = getMaxShift(r.width);
        var sx = (dx/(dist||1)) * ratio * maxShift;
        var sy = (dy/(dist||1)) * ratio * maxShift;
        item.pupils.forEach(function(p){
            p.style.transform = 'translate(calc(-50% + '+sx+'px), calc(-50% + '+sy+'px))';
        });
    });
});
})();
</script>
