<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1917;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 2rem;
  }

  .score {
    font-size: 1.5rem;
    font-weight: 600;
    color: #e7e5e4;
  }
  .score span { color: #84cc16; }

  canvas {
    border: 2px solid #44403c;
    border-radius: 4px;
    background: #292524;
    display: block;
  }

  .btn {
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.6rem 1.8rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s;
  }
  .btn-start { background: #84cc16; color: #1c1917; }
  .btn-start:hover { background: #a3e635; }
  .btn-reset { background: #44403c; color: #e7e5e4; }
  .btn-reset:hover { background: #57534e; }

  .tip {
    font-size: 0.8rem;
    color: #78716c;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <span class="score">🍎 <span id="score">0</span></span>
    <button class="btn btn-start" id="btnStart" onclick="startGame()">开始游戏</button>
    <button class="btn btn-reset" id="btnReset" onclick="resetGame()">重新开始</button>
  </div>
  <canvas id="canvas"></canvas>
  <p class="tip">↑ ↓ ← → 方向键控制移动</p>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const gridSize = 20;
const cols = 20;
const rows = 20;
canvas.width = cols * gridSize;
canvas.height = rows * gridSize;

let snake, food, direction, nextDirection, score, gameLoop, gameRunning;

function init() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  gameRunning = false;
  updateScore();
  spawnFood();
  draw();
}

function spawnFood() {
  do {
    food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function startGame() {
  if (gameRunning) return;
  if (snake.length <= 3) init();
  gameRunning = true;
  document.getElementById('btnStart').textContent = '游戏中…';
  gameLoop = setInterval(tick, 130);
}

function resetGame() {
  clearInterval(gameLoop);
  init();
  document.getElementById('btnStart').textContent = '开始游戏';
  draw();
}

function tick() {
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  /* Wall collision */
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) return gameOver();

  /* Self collision */
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    updateScore();
    spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function gameOver() {
  clearInterval(gameLoop);
  gameRunning = false;
  document.getElementById('btnStart').textContent = '开始游戏';
  /* Flash the head red */
  draw();
  ctx.fillStyle = '#ef4444';
  const h = snake[0];
  ctx.fillRect(h.x * gridSize + 2, h.y * gridSize + 2, gridSize - 4, gridSize - 4);
}

function updateScore() {
  document.getElementById('score').textContent = score;
}

function draw() {
  /* Background */
  ctx.fillStyle = '#292524';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  /* Grid lines */
  ctx.strokeStyle = '#3a3735';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= cols; i++) { ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke(); }
  for (let i = 0; i <= rows; i++) { ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke(); }

  /* Food */
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  /* Snake */
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#84cc16' : '#65a30d';
    ctx.fillRect(s.x * gridSize + 2, s.y * gridSize + 2, gridSize - 4, gridSize - 4);
  });
}

/* Keyboard */
document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  const k = e.key;
  if ((k === 'ArrowUp' || k === 'w') && direction.y !== 1)    nextDirection = { x: 0, y: -1 };
  if ((k === 'ArrowDown' || k === 's') && direction.y !== -1)  nextDirection = { x: 0, y: 1 };
  if ((k === 'ArrowLeft' || k === 'a') && direction.x !== 1)   nextDirection = { x: -1, y: 0 };
  if ((k === 'ArrowRight' || k === 'd') && direction.x !== -1) nextDirection = { x: 1, y: 0 };
  if (k === ' ') { e.preventDefault(); startGame(); }
});

init();
draw();
</script>
</body>
</html>
