<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero预览 — 打地鼠入口</title>
<style>
:root {
    --navy: #39375b;
    --hero-bg: #e4e9f5;
    --accent: #3498db;
    --accent-hover: #1464cc;
    --text-dark: #111827;
    --text-gray: #6b7280;
    --white: #ffffff;
    --font-heading: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-body: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: var(--font-body);
    font-size: 18px;
    line-height: 1.7;
    color: #4b5563;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

/* ===== Hero ===== */
.hero {
    background: var(--hero-bg);
    padding: 60px 40px 50px;
    border-radius: 16px;
    width: 100%;
}
.hero-inner {
    display: flex;
    align-items: center;
    gap: 40px;
}
.hero-left {
    flex: 1;
    min-width: 0;
}

/* 小人区 */
.hero-faces {
    display: flex;
    align-items: flex-end;
    gap: 0;
    cursor: pointer;
    user-select: none;
    margin-bottom: 16px;
}
.hface {
    position: relative;
    flex-shrink: 0;
}
.hface:active { transform: scale(.94); transition: transform .15s; }
.hface .hface-bg { display: block; }
.hface .heye {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    overflow: visible;
}
.hface .hpupil {
    background: #111;
    border-radius: 44% 48% 42% 46%;
    z-index: 1;
    position: relative;
}
.hface .hpupil::after {
    content: '';
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: .85;
}
.hface .hmouth {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
}
.hface .hmouth svg { display: block; }

.hface-dad {
    width: 120px; height: 120px;
    margin-right: -18px;
    z-index: 3;
}
.hface-dad .heye { width: 18px; height: 20px; }
.hface-dad .heye.eye-l { top: 32px; left: 34px; }
.hface-dad .heye.eye-r { top: 32px; right: 34px; }
.hface-dad .hpupil { width: 8px; height: 8px; }
.hface-dad .hpupil::after { top: 1.5px; left: 1.5px; width: 2.5px; height: 2.5px; }
.hface-dad .hmouth { bottom: 24px; }

.hface-mom {
    width: 96px; height: 96px;
    margin-left: -18px;
    margin-right: -14px;
    z-index: 2;
}
.hface-mom .heye { width: 15px; height: 17px; }
.hface-mom .heye.eye-l { top: 26px; left: 26px; }
.hface-mom .heye.eye-r { top: 26px; right: 26px; }
.hface-mom .hpupil { width: 6.5px; height: 6.5px; }
.hface-mom .hpupil::after { top: 1.2px; left: 1.2px; width: 2px; height: 2px; }
.hface-mom .hmouth { bottom: 18px; }

.hface-kid {
    width: 68px; height: 68px;
    margin-left: -14px;
    z-index: 1;
}
.hface-kid .heye { width: 11px; height: 13px; }
.hface-kid .heye.eye-l { top: 18px; left: 18px; }
.hface-kid .heye.eye-r { top: 18px; right: 18px; }
.hface-kid .hpupil { width: 5px; height: 5px; }
.hface-kid .hpupil::after { top: 1px; left: 1px; width: 1.5px; height: 1.5px; }
.hface-kid .hmouth { bottom: 13px; }

/* 标题 */
.hero h1 {
    color: var(--text-dark);
    font-family: var(--font-heading);
    font-size: 42px;
    font-weight: 600;
    line-height: 1.25;
    margin-bottom: 16px;
}
.hero .hero-sub {
    color: var(--text-gray);
    font-size: 16px;
    font-weight: 500;
    line-height: 1.8;
}

/* ===== 打地鼠陷阱区 ===== */
.mole-zone {
    position: relative;
    width: 180px;
    height: 200px;
    flex-shrink: 0;
}

/* 洞底阴影 — 最底层 */
.mole-hole {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 55px;
    background: radial-gradient(ellipse at center, #2c2847 0%, #1f1c35 55%, transparent 78%);
    border-radius: 50%;
    z-index: 1;
}
/* 洞内高光圈 — 增加深度感 */
.mole-hole::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 30px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.06) 0%, transparent 70%);
    border-radius: 50%;
}

/* 洞口盖板 — 跟Hero背景同色，地鼠从它下面钻出来 */
.mole-lip {
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 174px;
    height: 42px;
    background: #e4e9f5;
    border-radius: 50%;
    z-index: 5;
    pointer-events: none;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
}

/* 地鼠容器 */
.mole {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%) translateY(68px);
    width: 84px;
    height: 84px;
    transition: transform 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.08);
    z-index: 3;
    cursor: pointer;
}
.mole.pop {
    transform: translateX(-50%) translateY(-14px);
}
.mole:hover {
    filter: brightness(1.08);
}

/* 地鼠身体 — 更圆更萌 */
.mole-body {
    width: 84px;
    height: 72px;
    background: linear-gradient(180deg, #f0b860 0%, #e09d40 100%);
    border-radius: 44px 44px 24px 24px;
    position: relative;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18), inset 0 2px 0 rgba(255,255,255,0.2);
}
/* 肚子 */
.mole-body::after {
    content: '';
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 52px;
    height: 40px;
    background: #fde4b8;
    border-radius: 50%;
}
/* 眼睛 — 更大更萌 */
.mole-eyes {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
}
.mole-eye {
    width: 15px; height: 17px;
    background: #1a1a1a;
    border-radius: 50%;
    position: relative;
}
.mole-eye::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 5px; height: 5px;
    background: #fff;
    border-radius: 50%;
}
/* 鼻子 — 更大的红鼻头 */
.mole-nose {
    position: absolute;
    top: 29px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px; height: 14px;
    background: #d9485e;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
/* 腮红 */
.mole-blush {
    position: absolute;
    top: 36px;
    width: 16px; height: 10px;
    background: rgba(231, 76, 60, 0.3);
    border-radius: 50%;
}
.mole-blush.l { left: 6px; }
.mole-blush.r { right: 6px; }
/* 嘴 */
.mole-mouth {
    position: absolute;
    top: 42px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px; height: 12px;
    border-bottom: 2.5px solid #8b5a2b;
    border-radius: 0 0 50% 50%;
}

/* 钻出来时的全身微动 */
@keyframes moleWiggle {
    0%, 100% { transform: translateX(-50%) translateY(-14px) rotate(0deg); }
    25% { transform: translateX(-50%) translateY(-17px) rotate(-6deg); }
    75% { transform: translateX(-50%) translateY(-11px) rotate(6deg); }
}
.mole.wiggle {
    animation: moleWiggle 0.35s ease-in-out 3;
}

/* 对话气泡 */
.speech-bubble {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fff;
    border: 2px solid #e8a850;
    border-radius: 16px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 700;
    color: #5a3e1b;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
    pointer-events: none;
}
.speech-bubble.show {
    transform: translateX(-50%) scale(1);
}
/* 气泡三角 */
.speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 10px solid #fff;
}
.speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -13px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 12px solid #e8a850;
    z-index: -1;
}

/* 小手臂 */
.mole-arm {
    position: absolute;
    top: 24px;
    width: 18px;
    height: 32px;
    background: #e09d40;
    border-radius: 9px;
    z-index: 3;
    transform-origin: bottom center;
    opacity: 0;
    transition: opacity 0.15s;
}
.mole-arm.left { left: -12px; transform: rotate(25deg); }
.mole-arm.right { right: -12px; transform: rotate(-25deg); }
.mole.pop .mole-arm { opacity: 1; }
.mole.wiggle .mole-arm.right {
    animation: armWave 0.35s ease-in-out 3;
}
@keyframes armWave {
    0%, 100% { transform: rotate(-25deg); }
    50% { transform: rotate(-85deg); }
}

/* 浮动爱心 */
.float-heart {
    position: absolute;
    pointer-events: none;
    font-size: 22px;
    z-index: 20;
    animation: heartUp 1.2s ease-out forwards;
}
@keyframes heartUp {
    0% { opacity: 1; transform: translateY(0) scale(0.4) rotate(0deg); }
    30% { opacity: 1; transform: translateY(-25px) scale(1.1) rotate(-8deg); }
    100% { opacity: 0; transform: translateY(-100px) scale(0.7) rotate(10deg); }
}

/* 响应式 */
@media (max-width: 700px) {
    .hero-inner {
        flex-direction: column;
        gap: 20px;
        align-items: center;
    }
    .hero-left { text-align: center; }
    .hero-faces { justify-content: center; }
    .hero h1 { font-size: 28px; }
    .mole-zone { width: 150px; height: 160px; }
    .mole-hole { width: 110px; height: 44px; }
    .mole-lip { width: 148px; height: 34px; }
    .mole { width: 66px; height: 66px; bottom: 4px; }
    .mole.pop { transform: translateX(-50%) translateY(-8px); }
    .mole-body { width: 66px; height: 56px; }
    .mole-body::after { width: 42px; height: 32px; bottom: 4px; }
    .mole-eyes { top: 11px; gap: 12px; }
    .mole-eye { width: 12px; height: 13px; }
    .mole-eye::after { top: 2px; left: 2px; width: 4px; height: 4px; }
    .mole-nose { top: 23px; width: 17px; height: 11px; }
    .mole-blush { top: 28px; width: 12px; height: 7px; }
    .mole-blush.l { left: 5px; }
    .mole-blush.r { right: 5px; }
    .mole-mouth { top: 33px; width: 17px; height: 9px; }
    .mole-arm { top: 19px; width: 14px; height: 25px; }
    .mole-arm.left { left: -9px; }
    .mole-arm.right { right: -9px; }
    .speech-bubble { font-size: 13px; padding: 8px 12px; bottom: 80px; }
}
</style>
</head>
<body>

<div class="hero">
    <div class="hero-inner">

        <!-- 左侧：小人 + 标题 -->
        <div class="hero-left">
            <!-- 三个小人 -->
            <div class="hero-faces" id="heroFaces">
                <!-- 爸爸 -->
                <div class="hface hface-dad">
                    <svg class="hface-bg" viewBox="0 0 100 100" width="120" height="120">
                        <path d="M16 84 C18 58 22 34 26 22 C28 16 31 20 36 26 C39 32 42 35 48 35 C53 35 56 32 59 26 C64 20 67 16 69 22 C73 34 77 58 80 84 Z" fill="#f5c842" stroke="#d4a017" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <div class="heye eye-l"><div class="hpupil"></div></div>
                    <div class="heye eye-r"><div class="hpupil"></div></div>
                    <div class="hmouth"><svg width="22" height="8" viewBox="0 0 22 8"><path d="M3 2 Q11 8 19 2" fill="none" stroke="#8b6914" stroke-width="1.5" stroke-linecap="round"/></svg></div>
                </div>
                <!-- 妈妈 -->
                <div class="hface hface-mom">
                    <svg class="hface-bg" viewBox="0 0 100 100" width="96" height="96">
                        <path d="M20 84 C22 58 26 34 30 22 C31 15 33 18 37 24 C41 30 45 34 50 34 C55 34 59 30 63 24 C67 18 69 15 70 22 C74 34 78 58 80 84 Z" fill="#f0a5b5" stroke="#d48595" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <div class="heye eye-l"><div class="hpupil"></div></div>
                    <div class="heye eye-r"><div class="hpupil"></div></div>
                    <div class="hmouth"><svg width="16" height="6" viewBox="0 0 16 6"><path d="M1 2 Q8 7 15 2" fill="none" stroke="#b05060" stroke-width="1.5" stroke-linecap="round"/></svg></div>
                </div>
                <!-- 宝宝 -->
                <div class="hface hface-kid">
                    <svg class="hface-bg" viewBox="0 0 100 100" width="68" height="68">
                        <path d="M24 84 C25 62 28 40 32 28 C33 22 35 24 38 29 C41 34 44 38 50 38 C56 38 59 34 62 29 C65 24 67 22 68 28 C72 40 75 62 76 84 Z" fill="#ffd699" stroke="#e6b873" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <div class="heye eye-l"><div class="hpupil"></div></div>
                    <div class="heye eye-r"><div class="hpupil"></div></div>
                    <div class="hmouth"><svg width="12" height="5" viewBox="0 0 12 5"><path d="M1 3 Q6 7 11 3" fill="none" stroke="#c49530" stroke-width="1.2" stroke-linecap="round"/></svg></div>
                </div>
            </div>

            <h1>掌握地道英语，<br>开口就是自信！</h1>
            <p class="hero-sub">英语研习社为你整理最实用的英语学习资源，<br>从语法到口语，从词汇到发音，一站搞定。</p>
        </div>

        <!-- 右侧：打地鼠陷阱 -->
        <div class="mole-zone" id="moleZone">
            <div class="speech-bubble" id="speechBubble">先看看我吧！</div>
            <div class="mole-hole"></div>
            <div class="mole" id="mole">
                <div class="mole-arm left"></div>
                <div class="mole-arm right"></div>
                <div class="mole-body">
                    <div class="mole-eyes">
                        <div class="mole-eye"></div>
                        <div class="mole-eye"></div>
                    </div>
                    <div class="mole-nose"></div>
                    <div class="mole-blush l"></div>
                    <div class="mole-blush r"></div>
                    <div class="mole-mouth"></div>
                </div>
            </div>
            <div class="mole-lip"></div>
        </div>

    </div>
</div>

<script>
(function() {
    var mole = document.getElementById('mole');
    var bubble = document.getElementById('speechBubble');
    var zone = document.getElementById('moleZone');

    var phrases = [
        '先看看我吧！',
        '从哪开始？戳我！',
        '不知道学啥？点我~',
        '戳一下有惊喜！',
        '英语从这开始！',
        '嘿！看这里！'
    ];

    var currentPhrase = 0;

    function showBubble(text) {
        bubble.textContent = text;
        bubble.classList.add('show');
    }
    function hideBubble() {
        bubble.classList.remove('show');
    }

    function popUp() {
        var phrase = phrases[currentPhrase % phrases.length];
        currentPhrase++;
        showBubble(phrase);
        mole.classList.add('pop');

        // 偶尔扭一扭
        if (Math.random() > 0.5) {
            setTimeout(function() {
                mole.classList.add('wiggle');
            }, 200);
        }
    }

    function popDown() {
        hideBubble();
        mole.classList.remove('pop', 'wiggle');
    }

    // 冒出来的循环
    var popTimer;

    function schedulePop() {
        // 随机间隔 2-5 秒
        var delay = 2000 + Math.random() * 3000;
        popTimer = setTimeout(function() {
            popUp();
            // 停留 1.5-2.5 秒后下去
            var stay = 1500 + Math.random() * 1000;
            setTimeout(function() {
                popDown();
                schedulePop();
            }, stay);
        }, delay);
    }

    // 点击地鼠 → 跳转学习路径
    mole.addEventListener('click', function(e) {
        e.stopPropagation();
        // 点中心形
        spawnHearts(e);
        // 换一句开心的话
        showBubble('这就带你去！');
        setTimeout(function() {
            window.location.href = 'learning-path.html';
        }, 400);
    });

    // 心形特效
    function spawnHearts(e) {
        var hearts = ['❤️', '💕', '💖', '✨', '💛'];
        for (var i = 0; i < 6; i++) {
            var el = document.createElement('span');
            el.className = 'float-heart';
            el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            el.style.left = (e.clientX + (Math.random() - 0.5) * 80) + 'px';
            el.style.top = (e.clientY + (Math.random() - 0.5) * 40) + 'px';
            el.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
            el.style.fontSize = (18 + Math.random() * 16) + 'px';
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 1200);
        }
    }

    // 瞳孔跟随鼠标
    var allPupils = [];
    var faces = document.querySelectorAll('.hface');
    faces.forEach(function(face) {
        var pupils = face.querySelectorAll('.hpupil');
        pupils.forEach(function(p) {
            p.style.position = 'relative';
            p.style.left = '50%';
            p.style.top = '50%';
            p.style.transform = 'translate(-50%,-50%)';
        });
        allPupils.push({ face: face, pupils: Array.from(pupils) });
    });

    document.addEventListener('mousemove', function(e) {
        allPupils.forEach(function(item) {
            var r = item.face.getBoundingClientRect();
            var cx = r.left + r.width / 2;
            var cy = r.top + r.height / 2;
            var dx = e.clientX - cx;
            var dy = e.clientY - cy;
            var dist = Math.sqrt(dx * dx + dy * dy);
            var maxDist = 200;
            var ratio = Math.min(dist / maxDist, 1);
            var maxShift = r.width >= 120 ? 5 : (r.width >= 96 ? 4.2 : 3);
            var sx = (dx / (dist || 1)) * ratio * maxShift;
            var sy = (dy / (dist || 1)) * ratio * maxShift;
            item.pupils.forEach(function(p) {
                p.style.transform = 'translate(calc(-50% + ' + sx + 'px), calc(-50% + ' + sy + 'px))';
            });
        });
    });

    // 启动！
    setTimeout(function() {
        popUp();
        setTimeout(function() {
            popDown();
            schedulePop();
        }, 2000);
    }, 800);

})();
</script>

</body>
</html>
