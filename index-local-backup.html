<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fafaf9;
    color: #292524;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    max-width: 560px;
    padding: 2rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    color: #1c1917;
  }

  .intro {
    font-size: 1.05rem;
    line-height: 1.7;
    color: #78716c;
  }

  .divider {
    width: 40px;
    height: 2px;
    background: #d6d3d1;
    margin: 2rem auto;
    border-radius: 1px;
  }

  footer {
    padding: 1.25rem;
    font-size: 0.75rem;
    color: #c5bfb9;
  }
</style>
</head>
<body>
  <main>
    <h1>欢迎来访</h1>
    <p class="intro">这里是首页，一个安静的开始。简洁、干净，不做多余的事。</p>
    <div class="divider"></div>
  </main>
  <footer>&copy; 2026 All Rights Reserved</footer>
</body>
</html>
