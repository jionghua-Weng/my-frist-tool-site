<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Homepage</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0d0d0d;
    color: #fff;
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #333;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    margin-bottom: 2rem;
  }

  .contact-btn {
    display: inline-block;
    padding: 0.65rem 2rem;
    border: 1px solid #444;
    border-radius: 2rem;
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    transition: background 0.2s, border-color 0.2s;
  }

  .contact-btn:hover {
    background: #fff;
    color: #0d0d0d;
    border-color: #fff;
  }
</style>
</head>
<body>
  <div>
    <img class="avatar" src="https://placehold.co/192x192/2a2a2a/888?text=:) " alt="Avatar">
    <h1>你的名字</h1>
    <a class="contact-btn" href="mailto:hello@example.com">联系我</a>
  </div>
</body>
</html>
