<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favicon 方案预览 · Round 2</title>
<style>
  body { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f0f5; padding: 30px; }
  h1 { text-align: center; color: #39375b; margin-bottom: 8px; font-size: 24px; }
  .sub { text-align: center; color: #6b7280; margin-bottom: 35px; font-size: 14px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; max-width: 1000px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; padding: 28px 20px; text-align: center; box-shadow: 0 2px 16px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s; width: 210px; }
  .card:hover { transform: translateY(-5px); box-shadow: 0 8px 28px rgba(0,0,0,0.13); }
  .card.selected { border: 3px solid #3498db; box-shadow: 0 0 0 5px rgba(52,152,219,0.15); transform: translateY(-5px); }
  .row { display: flex; gap: 16px; justify-content: center; align-items: center; margin-bottom: 10px; }
  .title { font-weight: 700; font-size: 15px; color: #111827; margin-bottom: 6px; }
  .desc { font-size: 12px; color: #9ca3af; line-height: 1.4; }
  .btn-row { text-align: center; margin-top: 35px; }
  button { background: #3498db; color: #fff; border: none; padding: 12px 36px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  button:hover { background: #1464cc; }
  button:disabled { background: #bbb; cursor: not-allowed; }
  #selected-label { margin-bottom: 10px; color: #6b7280; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>

<h1>英语研习社 — Favicon 方案预览 · Round 2</h1>
<p class="sub">更前卫 · 更抽象 · 更有辨识度 &nbsp;|&nbsp; 上方 64px / 下方 32px（真实尺寸）</p>

<div class="grid" id="grid">

  <!-- 方案1: 声波纹 - 说话/交流 -->
  <div class="card" data-id="1" onclick="select(this)">
    <div class="title">声波 · 交流</div>
    <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><circle cx="12" cy="16" r="2" fill="#fff"/><path d="M18 12a5 5 0 0 1 0 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M22 9a9 9 0 0 1 0 14" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/></svg>
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><circle cx="12" cy="16" r="2" fill="#fff"/><path d="M18 12a5 5 0 0 1 0 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M22 9a9 9 0 0 1 0 14" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/></svg>
    <div class="desc">声波扩散，象征开口说英语</div>
  </div>

  <!-- 方案2: 几何钻石 - 精雕细琢 -->
  <div class="card" data-id="2" onclick="select(this)">
    <div class="title">钻石 · 精进</div>
    <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><polygon points="16,6 24,14 16,26 8,14" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><line x1="16" y1="11" x2="16" y2="21" stroke="#fff" stroke-width="1.2" opacity="0.5"/><line x1="11" y1="14" x2="21" y2="14" stroke="#fff" stroke-width="1.2" opacity="0.5"/></svg>
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><polygon points="16,6 24,14 16,26 8,14" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><line x1="16" y1="11" x2="16" y2="21" stroke="#fff" stroke-width="1.2" opacity="0.5"/><line x1="11" y1="14" x2="21" y2="14" stroke="#fff" stroke-width="1.2" opacity="0.5"/></svg>
    <div class="desc">打磨语言如同雕琢钻石</div>
  </div>

  <!-- 方案3: 抽象大脑/节点 -->
  <div class="card" data-id="3" onclick="select(this)">
    <div class="title">神经网络 · 连接</div>
    <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><circle cx="10" cy="10" r="2.5" fill="#3498db"/><circle cx="22" cy="10" r="2.5" fill="#3498db"/><circle cx="16" cy="22" r="2.5" fill="#fff"/><line x1="12" y1="11" x2="14" y2="20" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="20" y1="11" x2="18" y2="20" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="11" y1="10" x2="21" y2="10" stroke="#fff" stroke-width="1" opacity="0.4"/></svg>
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><circle cx="10" cy="10" r="2.5" fill="#3498db"/><circle cx="22" cy="10" r="2.5" fill="#3498db"/><circle cx="16" cy="22" r="2.5" fill="#fff"/><line x1="12" y1="11" x2="14" y2="20" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="20" y1="11" x2="18" y2="20" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="11" y1="10" x2="21" y2="10" stroke="#fff" stroke-width="1" opacity="0.4"/></svg>
    <div class="desc">神经元连接，语言在脑中生长</div>
  </div>

  <!-- 方案4: 箭头向上突破 -->
  <div class="card" data-id="4" onclick="select(this)">
    <div class="title">突破 · 上升</div>
    <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><path d="M10 18 L15 12 L20 18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 12 L15 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="10" r="1.5" fill="#3498db"/><circle cx="20" cy="10" r="1.5" fill="#3498db" opacity="0.6"/></svg>
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><path d="M10 18 L15 12 L20 18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 12 L15 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="10" r="1.5" fill="#3498db"/><circle cx="20" cy="10" r="1.5" fill="#3498db" opacity="0.6"/></svg>
    <div class="desc">突破语言障碍，持续上升</div>
  </div>

  <!-- 方案5: 对话气泡 + 光标 -->
  <div class="card" data-id="5" onclick="select(this)">
    <div class="title">对话 · 输入</div>
    <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><rect x="8" y="9" width="16" height="12" rx="4" fill="none" stroke="#fff" stroke-width="1.5"/><polygon points="12,21 9,26 16,21" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><line x1="13" y1="13" x2="19" y2="13" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/><line x1="13" y1="16" x2="17" y2="16" stroke="#3498db" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/></svg>
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><rect x="8" y="9" width="16" height="12" rx="4" fill="none" stroke="#fff" stroke-width="1.5"/><polygon points="12,21 9,26 16,21" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><line x1="13" y1="13" x2="19" y2="13" stroke="#3498db" stroke-width="1.5" stroke-linecap="round"/><line x1="13" y1="16" x2="17" y2="16" stroke="#3498db" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/></svg>
    <div class="desc">对话气泡 + 打字光标，学以致用</div>
  </div>

  <!-- 方案6: 星座/星轨 -->
  <div class="card" data-id="6" onclick="select(this)">
    <div class="title">星座 · 探索</div>
    <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><circle cx="9" cy="8" r="1.5" fill="#fff"/><circle cx="16" cy="10" r="1.5" fill="#fff"/><circle cx="23" cy="8" r="1.5" fill="#fff"/><circle cx="13" cy="16" r="1.5" fill="#3498db"/><circle cx="19" cy="16" r="1.5" fill="#3498db"/><circle cx="16" cy="23" r="1.5" fill="#fff"/><line x1="9" y1="8" x2="16" y2="10" stroke="#fff" stroke-width="0.8" opacity="0.5"/><line x1="16" y1="10" x2="23" y2="8" stroke="#fff" stroke-width="0.8" opacity="0.5"/><line x1="13" y1="16" x2="19" y2="16" stroke="#fff" stroke-width="0.8" opacity="0.5"/><line x1="16" y1="10" x2="13" y2="16" stroke="#fff" stroke-width="0.8" opacity="0.4"/><line x1="16" y1="10" x2="19" y2="16" stroke="#fff" stroke-width="0.8" opacity="0.4"/><line x1="13" y1="16" x2="16" y2="23" stroke="#fff" stroke-width="0.8" opacity="0.4"/><line x1="19" y1="16" x2="16" y2="23" stroke="#fff" stroke-width="0.8" opacity="0.4"/></svg>
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><circle cx="9" cy="8" r="1.5" fill="#fff"/><circle cx="16" cy="10" r="1.5" fill="#fff"/><circle cx="23" cy="8" r="1.5" fill="#fff"/><circle cx="13" cy="16" r="1.5" fill="#3498db"/><circle cx="19" cy="16" r="1.5" fill="#3498db"/><circle cx="16" cy="23" r="1.5" fill="#fff"/><line x1="9" y1="8" x2="16" y2="10" stroke="#fff" stroke-width="0.8" opacity="0.5"/><line x1="16" y1="10" x2="23" y2="8" stroke="#fff" stroke-width="0.8" opacity="0.5"/><line x1="13" y1="16" x2="19" y2="16" stroke="#fff" stroke-width="0.8" opacity="0.5"/><line x1="16" y1="10" x2="13" y2="16" stroke="#fff" stroke-width="0.8" opacity="0.4"/><line x1="16" y1="10" x2="19" y2="16" stroke="#fff" stroke-width="0.8" opacity="0.4"/><line x1="13" y1="16" x2="16" y2="23" stroke="#fff" stroke-width="0.8" opacity="0.4"/><line x1="19" y1="16" x2="16" y2="23" stroke="#fff" stroke-width="0.8" opacity="0.4"/></svg>
    <div class="desc">星座连接，探索语言的宇宙</div>
  </div>

  <!-- 方案7: 螺旋展开 -->
  <div class="card" data-id="7" onclick="select(this)">
    <div class="title">螺旋 · 展开</div>
    <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><path d="M16 16 Q20 12 22 16 Q24 20 20 22 Q14 24 12 18 Q10 12 16 8 Q24 6 26 14" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="26" cy="20" r="1.5" fill="#3498db"/></svg>
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><path d="M16 16 Q20 12 22 16 Q24 20 20 22 Q14 24 12 18 Q10 12 16 8 Q24 6 26 14" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="26" cy="20" r="1.5" fill="#3498db"/></svg>
    <div class="desc">螺旋式成长，从内向外打开世界</div>
  </div>

  <!-- 方案8: 像素化地球 -->
  <div class="card" data-id="8" onclick="select(this)">
    <div class="title">地球 · 全局</div>
    <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><circle cx="16" cy="16" r="8" fill="none" stroke="#fff" stroke-width="1.5"/><ellipse cx="16" cy="16" rx="4" ry="8" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="8" y1="16" x2="24" y2="16" stroke="#fff" stroke-width="1" opacity="0.4"/><line x1="12" y1="10" x2="12" y2="22" stroke="#3498db" stroke-width="1" opacity="0.5"/><line x1="20" y1="10" x2="20" y2="22" stroke="#3498db" stroke-width="1" opacity="0.5"/></svg>
    <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="7" fill="#39375b"/><circle cx="16" cy="16" r="8" fill="none" stroke="#fff" stroke-width="1.5"/><ellipse cx="16" cy="16" rx="4" ry="8" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="8" y1="16" x2="24" y2="16" stroke="#fff" stroke-width="1" opacity="0.4"/><line x1="12" y1="10" x2="12" y2="22" stroke="#3498db" stroke-width="1" opacity="0.5"/><line x1="20" y1="10" x2="20" y2="22" stroke="#3498db" stroke-width="1" opacity="0.5"/></svg>
    <div class="desc">英语是全球通行证</div>
  </div>

</div>

<div class="btn-row">
  <p id="selected-label">请点击选择一个方案</p>
  <button id="confirm-btn" disabled onclick="confirmChoice()">确认选择</button>
</div>

<script>
let selectedId = null;
function select(el) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedId = el.dataset.id;
  document.getElementById('selected-label').textContent = '已选择：方案 ' + selectedId;
  document.getElementById('confirm-btn').disabled = false;
}
function confirmChoice() {
  document.getElementById('selected-label').textContent = '已确认方案 ' + selectedId + '！请告诉 CC 你选的是方案 ' + selectedId;
  document.getElementById('confirm-btn').textContent = '已确认 ✓';
  document.getElementById('confirm-btn').disabled = true;
}
</script>

</body>
</html>
