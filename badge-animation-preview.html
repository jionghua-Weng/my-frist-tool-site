<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge 动画效果预览</title>
<style>
body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background: #f8f9fa; text-align: center; padding: 60px 20px; }
h1 { color: #1e293b; margin-bottom: 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 40px; max-width: 1100px; margin: 0 auto; }
.item { background: #fff; border-radius: 14px; padding: 40px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.item h3 { font-size: 16px; color: #64748b; margin-bottom: 24px; }
.badge { display: inline-block; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-size: 14px; font-weight: 700; padding: 6px 20px; border-radius: 20px; letter-spacing: 1px; }

/* 1. 浮动 */
.a1 { animation: floatUp 3s ease-in-out infinite; }
@keyframes floatUp { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }

/* 2. 呼吸 */
.a2 { animation: breathe 2.5s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }

/* 3. 摆动 */
.a3 { animation: sway 3.5s ease-in-out infinite; }
@keyframes sway { 0%,100% { transform: rotate(0deg) } 25% { transform: rotate(2deg) } 75% { transform: rotate(-2deg) } }

/* 4. 光晕呼吸 */
.a4 { animation: glowBreathe 2.5s ease-in-out infinite; }
@keyframes glowBreathe { 0%,100% { box-shadow: 0 0 4px rgba(245,158,11,0.3) } 50% { box-shadow: 0 0 20px rgba(245,158,11,0.7), 0 0 40px rgba(245,158,11,0.3) } }

/* 5. 浮+摆 */
.a5 { animation: floatSway 3s ease-in-out infinite; }
@keyframes floatSway { 0%,100% { transform: translateY(0) rotate(0deg) } 33% { transform: translateY(-4px) rotate(1.5deg) } 66% { transform: translateY(-2px) rotate(-1.5deg) } }

/* 6. 脉搏（放大+光晕） */
.a6 { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); box-shadow: 0 0 4px rgba(245,158,11,0.2) } 50% { transform: scale(1.06); box-shadow: 0 0 18px rgba(245,158,11,0.6) } }
</style>
</head>
<body>
<h1>Badge 动画效果预览</h1>
<div class="grid">
  <div class="item"><h3>1. 上下浮动</h3><span class="badge a1">大白话语法系列</span></div>
  <div class="item"><h3>2. 呼吸缩放</h3><span class="badge a2">大白话语法系列</span></div>
  <div class="item"><h3>3. 左右摆动</h3><span class="badge a3">大白话语法系列</span></div>
  <div class="item"><h3>4. 光晕呼吸</h3><span class="badge a4">大白话语法系列</span></div>
  <div class="item"><h3>5. 浮动+摆动</h3><span class="badge a5">大白话语法系列</span></div>
  <div class="item"><h3>6. 脉搏（缩放+光晕）</h3><span class="badge a6">大白话语法系列</span></div>
</div>
</body>
</html>
